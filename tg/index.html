<!doctype html>
<!-- Переход в Telegram-канал для сторис Instagram (07.10.2026): инста молча делает некликабельными стикеры-ссылки
     на t.me, поэтому в стикер ставится ссылка на эту страницу (наш сайт), а отсюда — в Telegram.
     scripts/build_showcase.py кладёт её в data/showcase/tg/index.html, подставляя код приглашения вместо b4rE67ahgk1mZDUy. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sneaker Flow — Telegram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Permanent+Marker&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0b; --lime: #c4f82a; --ink: #0a0a0a; --text: #f2f2f0; --muted: #a5a59e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(60% 40% at 85% 10%, rgba(196,248,42,.18), transparent 70%),
                radial-gradient(50% 40% at 5% 70%, rgba(47,107,255,.14), transparent 70%), var(--bg); }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo { font: 700 44px/1 Oswald, sans-serif; letter-spacing: .5px; font-style: italic; text-transform: uppercase; }
  .logo b { font: 400 50px/1 "Permanent Marker", cursive; color: var(--lime); font-style: normal; text-transform: none; margin-left: 4px; }
  h1 { font: 700 30px/1.15 Oswald, sans-serif; text-transform: uppercase; margin: 28px 0 10px; }
  h1 span { color: var(--lime); }
  p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 26px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 20px 18px;
    border-radius: 18px; background: var(--lime); color: var(--ink); font: 700 19px/1 Manrope, sans-serif; text-decoration: none;
    box-shadow: 0 10px 40px rgba(196,248,42,.35); }
  .btn svg { width: 26px; height: 26px; flex: none; }
  .alt { display: block; margin-top: 18px; color: var(--text); font-size: 14px; word-break: break-all; }
  .hint { margin-top: 26px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); font-size: 13px; color: var(--muted); line-height: 1.45; }
  .hint b { color: var(--text); }
</style>
</head>
<body>
<main>
  <div class="logo">Sneaker<b>Flow</b></div>
  <h1>Все модели и цены — <span>в нашем Telegram</span></h1>
  <p>Фото, размеры и новинки каждый день. Заказ — в пару нажатий.</p>
  <a class="btn" id="go" href="https://t.me/+b4rE67ahgk1mZDUy">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5L18 6.2c.4-.3-.1-.5-.6-.2L6.2 13 1.4 11.5c-1-.3-1-1 .2-1.5L20.6 2.8c.9-.3 1.6.2 1.3 1.5z"/></svg>
    Открыть канал в Telegram
  </a>
  <a class="alt" href="https://t.me/+b4rE67ahgk1mZDUy">t.me/+b4rE67ahgk1mZDUy</a>
  <div class="hint">Не открылось? Нажми <b>⋯</b> вверху справа → <b>«Открыть в браузере»</b> и нажми кнопку ещё раз.</div>
</main>
<script>
  // Во встроенном браузере инсты обычная ссылка t.me часто не перекидывает в приложение — открываем Telegram напрямую.
  (function () {
    var code = "b4rE67ahgk1mZDUy", ua = navigator.userAgent || "";
    var web = "https://t.me/+" + code;
    var app = /Android/i.test(ua)
      ? "intent://join?invite=" + code + "#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
      : /iPhone|iPad|iPod/i.test(ua) ? "tg://join?invite=" + code : web;
    document.getElementById("go").href = app;
    if (app !== web) setTimeout(function () { location.href = app; }, 350);
  })();
</script>
</body>
</html>
