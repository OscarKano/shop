<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sneaker Flow — витрина</title>
<!-- Мини-витрина в Telegram (scripts/build_showcase.py кладёт рядом catalog.json и img/). Внутри Telegram берёт его
     цвета темы и кнопку «Назад»; «Заказать» открывает бот-каталог (/start o<id>_<размер>) — заявка как из каталога. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --text: #111418; --hint: #8a9099; --card: #f3f4f6; --line: #e6e8eb;
    --accent: #2f7cf6; --accent-text: #ffffff; --badge: #ff4d4f; --shadow: 0 6px 24px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191d; --text: #f1f3f5; --hint: #8f97a3; --card: #23262c; --line: #2e3238; --shadow: 0 6px 24px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 500 15px/1.35 "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  /* на широком экране — колонка по центру, а не на весь монитор (06.10: карточки растягивались на пол-экрана) */
  header > *, main { max-width: 1080px; margin-left: auto; margin-right: auto; }
  body.locked { overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line); }
  .brandline { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .logo { font-weight: 800; font-size: 19px; letter-spacing: .2px; }
  .count { color: var(--hint); font-size: 13px; }
  .search { position: relative; }
  .search input { width: 100%; border: 0; outline: 0; background: var(--card); border-radius: 12px;
    padding: 10px 36px 10px 36px; font-size: 16px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    font-size: 18px; color: var(--hint); padding: 4px 8px; display: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px;
    font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .selects { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding-top: 8px; }
  @media (min-width: 700px) { .selects { grid-template-columns: repeat(3, 200px); } }
  .selects select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px;
    padding: 7px 8px; font-size: 13px; appearance: none; -webkit-appearance: none; }
  .selects select.on { border-color: var(--accent); color: var(--accent); }

  main { padding: 12px 12px 90px; }
  /* карточка не шире ~200 px: на телефоне 2 в ряд, на компьютере 5–6 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; } }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; cursor: pointer; position: relative; border: 0;
    padding: 0; text-align: left; font-family: inherit; transition: transform .12s ease, box-shadow .12s ease; }
  @media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); } }
  .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--line); }
  .card { display: flex; flex-direction: column; }
  .card .info { padding: 8px 10px 10px; display: flex; flex-direction: column; flex: 1; }
  .card .name { font-weight: 700; font-size: 13.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -.1px; }
  .card .color { color: var(--hint); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* цена — к низу карточки: короткое название не оставляет пустую строку перед цветом, а ряд цен ровный */
  .card .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 6px; gap: 6px; }
  .card .price { font-weight: 800; font-size: 15px; white-space: nowrap; letter-spacing: -.2px; }
  .card .sz { color: var(--hint); font-size: 11.5px; white-space: nowrap; }
  .badge { position: absolute; top: 8px; left: 8px; background: var(--badge); color: #fff; font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 6px; letter-spacing: .3px; }
  .badge.w { left: auto; right: 8px; background: rgba(255,255,255,.92); color: #1b6fd1; }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }
  .empty a { display: inline-block; margin-top: 14px; }
  .note { color: var(--hint); font-size: 12.5px; text-align: center; padding: 18px 8px 0; line-height: 1.5; }
  a.btn, button.btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 12px;
    padding: 13px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--card); color: var(--text); font-weight: 600; }

  /* карточка модели */
  #sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; display: none;
    -webkit-overflow-scrolling: touch; }
  #sheet.open { display: block; animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  .close { position: fixed; top: 10px; right: 10px; z-index: 22; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.45); color: #fff; font-size: 20px; line-height: 36px; text-align: center; cursor: pointer; }
  body.tg .close { display: none; }  /* в Telegram — его кнопка «Назад» */
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--card); }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: none; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; scroll-snap-align: center; display: block; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .dots i.on { background: var(--accent); }
  /* стрелки по фото — для мыши (на телефоне листают свайпом) */
  .galwrap { position: relative; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.88); color: #111; font-size: 22px; line-height: 38px; text-align: center; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); display: none; padding: 0; }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }
  .nav[hidden] { display: none !important; }
  @media (hover: hover) { .nav { display: block; } }
  .body { padding: 12px 16px 130px; }
  .body h1 { font-size: 21px; margin: 4px 0 2px; line-height: 1.2; }
  .body .sub { color: var(--hint); margin-bottom: 8px; }
  .body .bigprice { font-size: 24px; font-weight: 800; margin: 6px 0 14px; }
  .label { font-weight: 700; margin: 14px 0 8px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .size { min-width: 58px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 8px 5px;
    text-align: center; cursor: pointer; }
  .size b { display: block; font-size: 16px; }
  .size small { color: var(--hint); font-size: 11px; }
  .size.on { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .size.on small { color: var(--accent-text); opacity: .85; }
  .help { display: inline-block; margin-top: 10px; color: var(--accent); background: none; border: 0; padding: 4px 0;
    font-size: 14px; cursor: pointer; }
  .about { margin-top: 16px; line-height: 1.5; }
  .about ul { padding: 0; margin: 8px 0 0; list-style: none; }
  .about li { margin: 5px 0; }
  .trust { margin-top: 16px; background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }
  .buy { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); }
  .buy .hint { text-align: center; color: var(--hint); font-size: 12.5px; margin-top: 6px; }
  /* на компьютере карточка модели — колонка по центру, а не фото во весь монитор */
  #sheetBody > *, .buy > * { max-width: 520px; margin-left: auto; margin-right: auto; }
  @media (min-width: 700px) {
    #sheet { background: rgba(0,0,0,.55); }
    #sheetBody { max-width: 520px; margin: 24px auto; background: var(--bg); border-radius: 18px; overflow: hidden; }
    .buy { left: 50%; right: auto; width: 520px; transform: translateX(-50%); border-radius: 18px 18px 0 0; }
  }
</style>
</head>
<body>
<header>
  <div class="brandline"><div class="logo">👟 Sneaker Flow</div><div class="count" id="count"></div></div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Бренд, модель, цвет или размер" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clear" aria-label="Очистить">×</button>
  </div>
  <div class="chips" id="tabs"></div>
  <div class="selects">
    <select id="brand"></select>
    <select id="size"></select>
    <select id="sort">
      <option value="new">Новые</option>
      <option value="cheap">Дешевле</option>
      <option value="exp">Дороже</option>
    </select>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="note">🛡 Оплата через Авито — деньги под защитой до получения<br>🚚 Доставка в пункт выдачи или курьером · 📦 Каждая пара в коробке</div>
</main>

<div id="sheet" role="dialog" aria-modal="true">
  <button class="close" id="x" aria-label="Закрыть">×</button>
  <div id="sheetBody"></div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.platform && Telegram.WebApp.platform !== "unknown" ? Telegram.WebApp : null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub = n => n.toLocaleString("ru-RU") + " ₽";
const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е");
const range = s => !s.length ? "" : (s.length > 2 && s[s.length - 1] - s[0] === s.length - 1 ? `${s[0]}–${s[s.length - 1]}` : s.join("/"));

let D = {models: []}, aliases = [];
const st = {tab: "all", brand: "", size: "", sort: "new", q: ""};
const TABS = [["all", "Все"], ["new", "🆕 Новинки"], ["men", "👨 Мужские"], ["women", "👩 Женские"],
              ["winter", "❄️ Зимние"], ["cheap", "💸 До 4 000 ₽"]];

if (tg) {
  document.body.classList.add("tg");
  tg.ready(); tg.expand();
  const applyTheme = () => {
    const p = tg.themeParams || {}, r = document.documentElement.style;
    if (p.bg_color) { r.setProperty("--bg", p.bg_color); }
    if (p.text_color) r.setProperty("--text", p.text_color);
    if (p.hint_color) r.setProperty("--hint", p.hint_color);
    if (p.secondary_bg_color) r.setProperty("--card", p.secondary_bg_color);
    if (p.button_color) r.setProperty("--accent", p.button_color);
    if (p.button_text_color) r.setProperty("--accent-text", p.button_text_color);
    if (p.section_separator_color) r.setProperty("--line", p.section_separator_color);
    try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } catch (e) {}
  };
  applyTheme(); tg.onEvent("themeChanged", applyTheme);
  tg.BackButton.onClick(() => closeSheet());
}

fetch("catalog.json?" + Date.now()).then(r => r.json()).then(data => {
  D = data;
  aliases = Object.entries(D.aliases || {}).sort((a, b) => b[0].length - a[0].length);
  D.models.forEach(m => {
    m.hay = norm([m.model, m.color, m.brand, m.gender === "female" ? "женские" : "мужские", m.winter ? "зимние зима теплые" : ""].join(" "));
  });
  setup(); render();
  const start = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;  // ссылка вида ?startapp=m123 — сразу модель
  const deep = (start || location.hash.slice(1)).match(/^m(\d+)$/);
  if (deep) { const m = D.models.find(x => x.id === +deep[1]); if (m) openSheet(m); }
}).catch(() => { $("empty").hidden = false; $("empty").textContent = "Не удалось загрузить каталог — попробуйте позже."; });

function setup() {
  $("tabs").innerHTML = TABS.map(([k, t]) => `<button class="chip${k === st.tab ? " on" : ""}" data-k="${k}">${t}</button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; st.tab = b.dataset.k; setup(); render(); };
  const brands = Object.entries(D.models.reduce((a, m) => (m.brand && (a[m.brand] = (a[m.brand] || 0) + 1), a), {}))
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  $("brand").innerHTML = `<option value="">Все бренды</option>` + brands.map(([b, n]) => `<option value="${esc(b)}">${esc(b)} · ${n}</option>`).join("");
  const sizes = [...new Set(D.models.flatMap(m => m.sizes))].sort((a, b) => a - b);
  $("size").innerHTML = `<option value="">Любой размер</option>` + sizes.map(s => `<option value="${s}">Размер ${s}</option>`).join("");
  $("brand").value = st.brand; $("size").value = st.size; $("sort").value = st.sort;
  for (const id of ["brand", "size", "sort"]) $(id).onchange = e => { st[id] = e.target.value; render(); };
  $("q").oninput = e => { st.q = e.target.value; $("clear").style.display = st.q ? "block" : "none"; render(); };
  $("clear").onclick = () => { $("q").value = ""; st.q = ""; $("clear").style.display = "none"; render(); };
  $("x").onclick = closeSheet;
}

function parseQuery(q) {
  let s = " " + norm(q) + " ";
  for (const [ru, en] of aliases) s = s.split(" " + ru + " ").join(" " + en + " ");
  const words = [], sizes = [];
  for (const w of s.split(/[\s,]+/).filter(Boolean)) {
    if (/^\d+$/.test(w) && +w >= 35 && +w <= 48) sizes.push(+w); else if (w.length > 1 || /\d/.test(w)) words.push(w);
  }
  return {words, sizes};
}

function filtered() {
  const {words, sizes} = parseQuery(st.q);
  let list = D.models.filter(m =>
    (st.tab === "all" || (st.tab === "new" && m.new) || (st.tab === "men" && m.gender !== "female") ||
     (st.tab === "women" && m.gender === "female") || (st.tab === "winter" && m.winter) ||
     (st.tab === "cheap" && m.price <= (D.budget || 4000))) &&
    (!st.brand || m.brand === st.brand) && (!st.size || m.sizes.includes(+st.size)) &&
    sizes.every(s => m.sizes.includes(s)) &&
    words.every(w => /^\d+$/.test(w) ? new RegExp(`(^|\\D)${w}(\\D|$)`).test(m.hay) : m.hay.includes(w)));
  const by = {new: (a, b) => b.date.localeCompare(a.date) || b.id - a.id, cheap: (a, b) => a.price - b.price, exp: (a, b) => b.price - a.price};
  return list.sort(by[st.sort]);
}

function render() {
  const list = filtered();
  $("count").textContent = list.length === D.models.length ? `${D.models.length} моделей` : `${list.length} из ${D.models.length}`;
  ["brand", "size"].forEach(id => $(id).classList.toggle("on", !!st[id]));
  $("grid").innerHTML = list.map(m => `
    <button class="card" data-id="${m.id}">
      <img src="${m.thumb}" alt="" loading="lazy" decoding="async">
      ${m.new ? '<span class="badge">NEW</span>' : ""}${m.winter ? '<span class="badge w">❄️</span>' : ""}
      <div class="info">
        <div class="name">${esc(m.model)}</div>
        <div class="color">${esc(m.color || " ")}</div>
        <div class="row"><span class="price">${rub(m.price)}</span><span class="sz">${range(m.sizes)}</span></div>
      </div>
    </button>`).join("");
  const empty = $("empty");
  empty.hidden = list.length > 0;
  if (!list.length) {
    const ask = encodeURIComponent(`Здравствуйте! Ищу: ${st.q || "кроссовки"}. Есть что-то похожее?`);
    empty.innerHTML = `Ничего не нашли 😔<br>Попробуйте другой фильтр — или спросите менеджера, подскажем.<br>
      <a class="btn ghost" href="https://t.me/${D.manager}?text=${ask}" style="max-width:280px;margin:14px auto 0">💬 Спросить менеджера</a>`;
  }
}
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) openSheet(D.models.find(m => m.id === +c.dataset.id)); };

let cur = null, chosen = null, sheetKeys = null;
document.addEventListener("keydown", e => {
  if (!cur) return;
  if (e.key === "Escape") closeSheet(); else if (sheetKeys) sheetKeys(e);
});
// ряд вкладок прокручивается и колесом мыши (на узком окне не все влезают)
document.getElementById("tabs").addEventListener("wheel", e => {
  const t = e.currentTarget;
  if (t.scrollWidth > t.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { t.scrollLeft += e.deltaY; e.preventDefault(); }
}, {passive: false});
function openSheet(m) {
  cur = m; chosen = null;
  const photos = m.photos.map((p, i) => `<img src="${p}" alt="" ${i ? 'loading="lazy"' : ""} decoding="async">`).join("");
  const dots = m.photos.length > 1 ? `<div class="dots" id="dots">${m.photos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : "";
  const sizes = m.sizes.map(s => `<button class="size" data-s="${s}"><b>${s}</b>${m.cm[s] ? `<small>${m.cm[s]} см</small>` : ""}</button>`).join("");
  const arrows = m.photos.length > 1 ? `<button class="nav prev" id="prev" aria-label="Назад" hidden>‹</button><button class="nav next" id="next" aria-label="Дальше">›</button>` : "";
  $("sheetBody").innerHTML = `
    <div class="galwrap"><div class="gallery" id="gal">${photos}</div>${arrows}</div>${dots}
    <div class="body">
      <h1>${esc(m.model)}</h1>
      <div class="sub">${esc([m.color, m.gender === "female" ? "женские" : "", m.winter ? "❄️ на холодную погоду" : ""].filter(Boolean).join(" · "))}</div>
      <div class="bigprice">${rub(m.price)}</div>
      <div class="label">Размер</div>
      <div class="sizes" id="sizes">${sizes || '<span class="sub">уточните у менеджера</span>'}</div>
      <button class="help" id="dunno">🤔 Не знаю размер — помогите подобрать</button>
      ${m.intro || m.bullets.length ? `<div class="about">${esc(m.intro)}${m.bullets.length ? `<ul>${m.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>` : ""}
      <div class="trust">🛡 Покупка через Авито — деньги под защитой, пока не получите пару<br>🚚 Доставка в пункт выдачи или курьером<br>💬 Менеджер подтвердит наличие размера</div>
    </div>
    <div class="buy"><button class="btn" id="order" disabled>Выберите размер</button>
      <div class="hint">Откроется чат — сообщение для менеджера уже будет набрано</div></div>`;
  const gal = $("gal");
  if (dots) {
    const n = m.photos.length;
    const go = i => gal.scrollTo({left: Math.max(0, Math.min(n - 1, i)) * gal.clientWidth, behavior: "smooth"});
    const idx = () => Math.round(gal.scrollLeft / gal.clientWidth);
    gal.onscroll = () => {
      const i = idx();
      [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i));
      $("prev").hidden = i <= 0; $("next").hidden = i >= n - 1;
    };
    $("prev").onclick = () => go(idx() - 1);
    $("next").onclick = () => go(idx() + 1);
    $("dots").onclick = e => { const k = [...$("dots").children].indexOf(e.target); if (k >= 0) go(k); };
    // колесо мыши над фото листает фото (по одному за прокрутку), а не страницу
    let lock = 0;
    gal.onwheel = e => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (!d) return;
      const i = idx(), to = i + (d > 0 ? 1 : -1);
      if (to < 0 || to > n - 1) return;  // на первом/последнем фото колесо крутит страницу дальше
      e.preventDefault();
      if (Date.now() - lock < 350) return;
      lock = Date.now(); go(to);
    };
    gal.tabIndex = 0;
    sheetKeys = e => { if (e.key === "ArrowRight") go(idx() + 1); if (e.key === "ArrowLeft") go(idx() - 1); };
  } else sheetKeys = null;
  $("sizes").onclick = e => {
    const b = e.target.closest(".size"); if (!b) return;
    chosen = +b.dataset.s;
    [...$("sizes").children].forEach(x => x.classList.toggle("on", x === b));
    const o = $("order"); o.disabled = false; o.textContent = `Заказать · ${chosen} · ${rub(m.price)}`;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  };
  $("order").onclick = () => chosen && order(m, chosen);
  $("dunno").onclick = () => order(m, 0);
  $("sheet").classList.add("open"); $("sheet").scrollTop = 0; document.body.classList.add("locked");
  if (tg) tg.BackButton.show(); else history.pushState({sheet: 1}, "");
}
function closeSheet() {
  $("sheet").classList.remove("open"); document.body.classList.remove("locked"); cur = null;
  if (tg) tg.BackButton.hide();
}
window.onpopstate = () => { if (cur) closeSheet(); };

function order(m, size) {
  // заявку оформляет бот-каталог: уведомит владельца и откроет чат с менеджером с готовым сообщением
  const url = `https://t.me/${D.bot}?start=o${m.id}_${size}`;
  if (tg) { tg.openTelegramLink(url); setTimeout(() => tg.close(), 300); } else location.href = url;
}
</script>
</body>
